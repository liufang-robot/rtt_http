[workspace]
name = "rtt-http-ci"
channels = ["https://prefix.dev/liufang-robot/orocos", "conda-forge"]
platforms = ["linux-64", "win-64"]

[dependencies]
orocos-dev = "==0.1.5"
cmake = ">=3.20"
ninja = "*"

[target.linux-64.dependencies]
cxx-compiler = "*"

[target.unix.activation]
scripts = ["tools/activate-sdk.sh"]

[target.linux-64.tasks]
ci-cmake = "cmake"
ci-ctest = "ctest"

[target.win.tasks]
ci-cmake = "pwsh -NoProfile -File tools/ci-command.ps1 cmake"
ci-ctest = "pwsh -NoProfile -File tools/ci-command.ps1 ctest"

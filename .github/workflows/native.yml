name: Native HTTP SDK
on:
  pull_request:
  push:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-http-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: liufang-robot/cpp-httplib
          ref: c478e5be729840c313d76e3ea8c9a6b304f7892b
          path: .ci-dependencies/cpp-httplib
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347
        with:
          pixi-version: v0.76.2
          locked: false
          cache: false
      - name: Configure against released RTT SDK
        run: >-
          pixi run cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install
          -DRTT_HTTP_HTTPLIB_INCLUDE_DIR=${{ github.workspace }}/.ci-dependencies/cpp-httplib
      - name: Build native library and contracts
        run: pixi run cmake --build build --parallel 2
      - name: Verify JSON and REST lifetime contracts
        run: pixi run ctest --test-dir build --output-on-failure
      - name: Install runtime and public SDK
        run: pixi run cmake --install build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: failure()
        with:
          name: http-diagnostics-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            build/Testing/Temporary/*.log
            build/CMakeFiles/CMakeConfigureLog.yaml
